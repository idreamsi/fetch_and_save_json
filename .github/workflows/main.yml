name: Fetch and Save JSON Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [ main ]

jobs:
  fetch-json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Create Go script
      run: |
        cat > fetch_json.go << 'EOF'
        package main

        import (
            "encoding/json"
            "fmt"
            "io"
            "net/http"
            "os"
            "path/filepath"
            "time"
        )

        // ساختار جدید برای پاسخ API دیجی‌کالا
        type DigiPricesResponse struct {
            Data struct {
                Price []struct {
                    ID          string `json:"id"`
                    Price       string `json:"price"`
                    Difference  string `json:"difference"`
                    PriceChange string `json:"price_change"`
                    TTL         string `json:"ttl"`
                } `json:"price"`
            } `json:"data"`
        }

        // ساختار خروجی برای ذخیره در فایل (همانند قبل)
        type PriceData struct {
            Gold18   Item `json:"gold18"`
            Silver999 Item `json:"silver999"`
        }

        type Item struct {
            Price int `json:"price"`
            TTL   int `json:"ttl"`
        }

        func main() {
            // **تغییر: آدرس جدید API دیجی‌کالا**
            url := "https://api.digikala.com/non-inventory/v1/prices/"

            client := &http.Client{
                Timeout: 25 * time.Second,
            }

            req, err := http.NewRequest("GET", url, nil)
            if err != nil {
                fmt.Printf("خطا در ایجاد درخواست: %v\n", err)
                os.Exit(1)
            }

            // **اضافه کردن هدرهای جدید**
            req.Header.Set("User-Agent", "Mozilla/5.0")
            req.Header.Set("Referer", "https://digikala.com/")
            req.Header.Set("Origin", "https://digikala.com")
            req.Header.Set("platform", "webClient")
            req.Header.Set("Accept", "application/json")

            // ارسال درخواست
            resp, err := client.Do(req)
            if err != nil {
                fmt.Printf("خطا در ارسال درخواست: %v\n", err)
                os.Exit(1)
            }
            defer resp.Body.Close()

            // بررسی وضعیت پاسخ
            if resp.StatusCode != http.StatusOK {
                fmt.Printf("وضعیت ناموفق: %s\n", resp.Status)
                os.Exit(1)
            }

            // خواندن بدنه پاسخ
            body, err := io.ReadAll(resp.Body)
            if err != nil {
                fmt.Printf("خطا در خواندن بدنه: %v\n", err)
                os.Exit(1)
            }

            // **تغییر: تجزیه JSON با ساختار جدید**
            var digiData DigiPricesResponse
            if err := json.Unmarshal(body, &digiData); err != nil {
                fmt.Printf("خطا در تجزیه JSON: %v\n", err)
                os.Exit(1)
            }

            // **تبدیل داده‌های دیجی‌کالا به ساختار خروجی**
            var goldPrice, silverPrice int
            var goldTTL, silverTTL int

            for _, item := range digiData.Data.Price {
                switch item.ID {
                case "gold18": // شناسه طلا
                    goldPrice = parseInt(item.Price)
                    goldTTL = parseInt(item.TTL)
                case "silver999": // شناسه نقره
                    silverPrice = parseInt(item.Price)
                    silverTTL = parseInt(item.TTL)
                }
            }

            // ساخت داده خروجی
            data := PriceData{
                Gold18: Item{
                    Price: goldPrice,
                    TTL:   goldTTL,
                },
                Silver999: Item{
                    Price: silverPrice,
                    TTL:   silverTTL,
                },
            }

            // ایجاد نام فایل با timestamp
            timestamp := time.Now().Format("2006-01-02_15-04-05")
            filename := fmt.Sprintf("gold_price_%s.json", timestamp)

            // مسیر پوشه data (در صورت نبود، ایجاد می‌کند)
            dataDir := "data"
            if err := os.MkdirAll(dataDir, 0755); err != nil {
                fmt.Printf("خطا در ایجاد پوشه: %v\n", err)
                os.Exit(1)
            }

            fullPath := filepath.Join(dataDir, filename)

            // ذخیره JSON در فایل (با indent برای خوانایی بهتر)
            prettyJSON, err := json.MarshalIndent(data, "", "  ")
            if err != nil {
                fmt.Printf("خطا در تبدیل JSON: %v\n", err)
                os.Exit(1)
            }

            if err := os.WriteFile(fullPath, prettyJSON, 0644); err != nil {
                fmt.Printf("خطا در ذخیره فایل: %v\n", err)
                os.Exit(1)
            }

            // همچنین ذخیره آخرین نسخه به عنوان latest.json
            latestPath := filepath.Join(dataDir, "latest.json")
            if err := os.WriteFile(latestPath, prettyJSON, 0644); err != nil {
                fmt.Printf("خطا در ذخیره latest.json: %v\n", err)
                os.Exit(1)
            }

            fmt.Printf("JSON با موفقیت ذخیره شد:\n")
            fmt.Printf("- %s\n", fullPath)
            fmt.Printf("- %s\n", latestPath)
            fmt.Printf("\nمحتوای ذخیره شده:\n%s\n", string(prettyJSON))
        }

        // تابع کمکی برای تبدیل string به int
        func parseInt(s string) int {
            var result int
            if s == "" {
                return 0
            }
            // حذف کاراکترهای غیر عددی
            var numStr string
            for _, ch := range s {
                if ch >= '0' && ch <= '9' {
                    numStr += string(ch)
                }
            }
            fmt.Sscanf(numStr, "%d", &result)
            return result
        }
        EOF

    - name: Run Go script
      run: go run fetch_json.go
      timeout-minutes: 2

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/
        git diff --staged --quiet || git commit -m "Auto-update gold prices [skip ci]"
        git push
